<div id="giscus-container">
  <div id="giscus"
       data-repo="{{ site.giscus.repo }}"
       data-repo-id="{{ site.giscus.repo_id }}"
       data-category="{{ site.giscus.category }}"
       data-category-id="{{ site.giscus.category_id }}"
       data-mapping="{{ site.giscus.mapping }}"
       data-strict="0"
       data-reactions-enabled="{{ site.giscus.reactions_enabled | default: true }}"
       data-emit-metadata="0"
       data-input-position="{{ site.giscus.input_position | default: 'bottom' }}"
       data-theme="{{ site.giscus.theme | default: 'light' }}"
       data-lang="{{ site.giscus.lang | default: 'zh-CN' }}">
  </div>
  <script src="https://giscus.app/client.js" async crossorigin="anonymous"></script>
</div>
